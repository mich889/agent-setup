# ==========================
# GENERAL SETTINGS
# ==========================

# Set default terminal to support colors
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*256col*:Tc"
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR true

# Enable mouse support (select windows, resize panes, scroll)
set -g mouse on
set -g focus-events on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Allow programs/shell to rename windows and panes
set -g allow-rename on
setw -g automatic-rename on

# Increase history limit
set -g history-limit 50000

# No delay for escape key
set -sg escape-time 0

# ==========================
# CATPPUCCIN MOCHA THEME
# ==========================

# Load Catppuccin theme
run-shell ~/.config/tmux/plugins/catppuccin/catppuccin.tmux

# Set theme flavor to mocha
set -g @catppuccin_flavour 'mocha'

# Window configuration
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

# Status bar modules (right side)
set -g @catppuccin_status_modules_right "directory user host date_time"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%H:%M"

# Popup window colors (Catppuccin Mocha)
set -g popup-style "bg=#1e1e2e,fg=#cdd6f4"
set -g popup-border-style "fg=#89b4fa"

# ==========================
# SYSTEM INFO
# ==========================

# Extend status-right length
set -g status-right-length 200

# Status-right: system info
set -g status-right "#[fg=#a6e3a1]  #(top -bn1 | grep 'Cpu(s)' | awk '{print 100-$8\"%\"}')#[default] #[fg=#f9e2af] #(free -h | awk '/^Mem:/ {print $3\"/\"$2}')#[default] #[fg=#fab387] #(df -h / | awk 'NR==2 {print $5}')#[default] "

# ==========================
# AGENT SESSIONS
# ==========================
# Agent session status, switching and forking are handled by agent-deck, which
# runs its sessions on their own tmux server (`[tmux] socket_name` in
# ~/.config/agent-deck/config.toml) so nothing here affects them:
#   agent-deck              open the TUI
#   tmux -L agent-deck ls   inspect those sessions from the shell

# ==========================
# KEY BINDINGS
# ==========================

# Set prefix key (default is Ctrl+b)
# set -g prefix C-a
# unbind C-b

# Reload config file with r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Toggle a hunk diff pane, no prefix needed. Falls back to the agent-deck
# session's repo when the current pane's cwd is not a git repo (the deck's is ~).
# Root-table bind: this takes Ctrl+Z before the pane, so job-control suspend
# (SIGTSTP) no longer works inside this tmux. That is the trade for one key.
bind -n C-z run-shell "~/bin/hunk-toggle.sh '#{pane_current_path}'"
unbind '"'
unbind %

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with Shift+arrow
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Up resize-pane -U 2
bind -n S-Down resize-pane -D 2

# ==========================
# MOUSE ENHANCEMENTS
# ==========================

# Allow mouse to select windows and panes
bind -n MouseDown1Pane select-pane -t=

# Scroll with mouse wheel
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"

# Copy mode improvements
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
